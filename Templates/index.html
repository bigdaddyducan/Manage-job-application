<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="{{ url_for('static', filename='styleSheet.css') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application tracker</title>
</head>
<body>
    <div id= "searching">
        <div id="searching">
            <search>
                <label>
                    Search Job:<br>
                    <input type="search" id = "query"/>
                </label>
            </search>
        </div>
        <div id="data_viewing">
            <p>Statistics</p>
            <div>
                <div class="stat-card">
                    <h3>Applied</h3>
                    <p>{{ applied }}</p>
                </div>
                <div class="stat-card">
                    <h3>Rejected</h3>
                    <p>{{ Rejected }}</p>
                </div>
                <div class="stat-card">
                    <h3>Interviewed</h3>
                    <p>{{ Interviewed }}</p>
                </div>
            </div>
        </div>
        <div id="gui">
        <p></p>
        </div>
    </div>
</body>
</html>
